packages:
  - app
  - packages/*
  - packages/providers/*
  - e2e
  - website
overrides:
  dompurify: ^3.4.11
  serialize-javascript: ^7.0.5
  '@esbuild-kit/core-utils>esbuild': ^0.25.0
allowBuilds:
  better-sqlite3: true
  edgedriver: false
  electron-winstaller: true
  esbuild: true
  geckodriver: false
  node-pty: true
  protobufjs: true
  sharp: true
  simple-git-hooks: true
onlyBuiltDependencies:
  - better-sqlite3
  - electron
  - esbuild
  - node-pty
  - protobufjs
  - simple-git-hooks
